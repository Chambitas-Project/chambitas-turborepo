syntax = "proto3";

package profile;

service ProfileService {
  // Student Profile
  rpc CreateStudentProfile (CreateStudentProfileRequest) returns (ProfileResponse) {}
  rpc GetStudentProfile (GetProfileRequest) returns (StudentProfileResponse) {}
  rpc UpdateStudentProfile (UpdateStudentProfileRequest) returns (ProfileResponse) {}
  
  // Employer Profile
  rpc CreateEmployerProfile (CreateEmployerProfileRequest) returns (ProfileResponse) {}
  rpc GetEmployerProfile (GetProfileRequest) returns (EmployerProfileResponse) {}
  rpc UpdateEmployerProfile (UpdateEmployerProfileRequest) returns (ProfileResponse) {}

  // Common
  rpc DeleteProfile (DeleteProfileRequest) returns (ProfileResponse) {}
  rpc SearchProfiles (SearchProfilesRequest) returns (SearchProfilesResponse) {}
  rpc GetProfile (GetProfileRequest) returns (UnifiedProfileResponse) {}
}

message SearchProfilesRequest {
  string query = 1;
  optional string role = 2;
  int32 limit = 3;
  int32 offset = 4;
}

message SearchProfilesResponse {
  repeated UnifiedProfileResponse profiles = 1;
}

enum ActivityType {
  APPLICATION = 0;
  PROJECT = 1;
}

message SkillInfo {
  string id = 1;
  string name = 2;
  int32 proficiencyLevel = 3;
  bool verified = 4;
}

message ActivityInfo {
  string id = 1;
  string title = 2;
  string status = 3;
  ActivityType type = 4;
  string date = 5;
}

message UnifiedProfileResponse {
  string id = 1;
  string role = 2;
  string fullName = 3;
  optional string career = 4;
  optional string universityId = 5;
  optional string universityName = 6;
  optional string universityLogo = 7;
  optional string sector = 8;
  optional string bio = 9;
  optional int32 academicCycle = 10;
  optional float gpa = 11;
  repeated SkillInfo skills = 12;
  repeated ActivityInfo activity = 13;
  bool isOnboarded = 14;
}

message GetProfileRequest {
  string id = 1; // Can be userId or profileId
}

message DeleteProfileRequest {
  string userId = 1;
}

message CreateStudentProfileRequest {
  string userId = 1;
  string fullName = 2;
  string career = 3;
  int32 academicCycle = 4;
  string universityId = 5;
  optional string bio = 6;
  optional string availabilityBlocks = 7;
  repeated string skills = 8;
}

message SkillUpdate {
  string skillId = 1;
  int32 proficiencyLevel = 2;
  bool deleted = 3;
}

message UpdateStudentProfileRequest {
  string userId = 1;
  optional string fullName = 2;
  optional string career = 3;
  optional int32 academicCycle = 4;
  optional string bio = 5;
  optional string availabilityBlocks = 6;
  repeated SkillUpdate skillUpdates = 7;
  optional float gpa = 8;
}

message CreateEmployerProfileRequest {
  string userId = 1;
  string companyName = 2;
  string ruc = 3;
  string sector = 4;
  optional string description = 5;
}

message UpdateEmployerProfileRequest {
  string userId = 1;
  optional string companyName = 2;
  optional string ruc = 3;
  optional string sector = 4;
  optional string description = 5;
}

message StudentProfileResponse {
  string id = 1;
  string fullName = 2;
  string career = 3;
  int32 academicCycle = 4;
  string universityId = 5;
  string bio = 6;
  string availabilityBlocks = 7;
  repeated string skills = 8;
  float gpa = 9;
  bool isOnboarded = 10;
  string createdAt = 11;
  string updatedAt = 12;
}

message EmployerProfileResponse {
  string id = 1;
  string companyName = 2;
  string ruc = 3;
  string sector = 4;
  string description = 5;
  bool verified = 6;
  bool isOnboarded = 7;
  string createdAt = 8;
  string updatedAt = 9;
}

message ProfileResponse {
  bool success = 1;
  bool isOnboarded = 2;
  optional string message = 3;
}
