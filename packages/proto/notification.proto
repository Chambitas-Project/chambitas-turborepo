syntax = "proto3";

package notification;

service NotificationService {
  // El método principal que llamarán otros servicios para persistir y disparar flujo
  rpc CreateNotification (CreateNotificationRequest) returns (CreateNotificationResponse) {}
  
  // Para envíos de notificaciones push
  rpc SendPushNotification (SendPushNotificationRequest) returns (SendPushNotificationResponse) {}
  
  // Lectura de notificaciones In-App
  rpc ListNotifications (ListNotificationsRequest) returns (ListNotificationsResponse) {}
  rpc MarkAsRead (MarkAsReadRequest) returns (MarkAsReadResponse) {}
}

enum NotificationType {
  SYSTEM = 0;
  MATCH = 1;
  APPLICATION = 2;
  MESSAGE = 3;
}

enum NotificationPriority {
  LOW = 0;
  MEDIUM = 1;
  HIGH = 2;
}

message CreateNotificationRequest {
  string user_id = 1;
  string title = 2;
  string message = 3;
  NotificationType type = 4;
  NotificationPriority priority = 5;
  string metadata_json = 6; // JSON string con datos específicos (project_id, etc)
}

message CreateNotificationResponse {
  bool success = 1;
  string notification_id = 2;
}

message SendPushNotificationRequest {
  string user_id = 1;
  string title = 2;
  string body = 3;
  optional string data_json = 4;
}

message SendPushNotificationResponse {
  bool success = 1;
  string message_id = 2;
}

message Notification {
  string id = 1;
  string user_id = 2;
  string title = 3;
  string message = 4;
  string type = 5;
  string priority = 6;
  string metadata_json = 7;
  optional string read_at = 8;
  string created_at = 9;
}

message ListNotificationsRequest {
  string user_id = 1;
  int32 limit = 2;
  int32 offset = 3;
}

message ListNotificationsResponse {
  repeated Notification notifications = 1;
  int32 total = 2;
  int32 unread_count = 3;
}

message MarkAsReadRequest {
  string id = 1;
  string user_id = 2;
}

message MarkAsReadResponse {
  bool success = 1;
}
