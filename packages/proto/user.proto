syntax = "proto3";

package user;

service AuthService {
  rpc Register (RegisterRequest) returns (RegisterResponse) {}
  rpc Login (LoginRequest) returns (LoginResponse) {}
  rpc UpdateOnboarding (OnboardingRequest) returns (OnboardingResponse) {}
}

message RegisterRequest {
  string email = 1;
  string password = 2;
  string role = 3;
  string university_id = 4;
}

message RegisterResponse {
  string user_id = 1;
  string email = 2;
}

message LoginRequest {
  string email = 1;
  string password = 2;
}

message LoginResponse {
  string user_id = 1;
  string email = 2;
  string role = 3;
  string access_token = 4;
}

message OnboardingRequest {
  string user_id = 1;
  string role = 2;
  // Student fields
  optional string full_name = 3;
  optional string career = 4;
  optional int32 academic_cycle = 5;
  // Employer fields
  optional string company_name = 6;
  optional string sector = 7;
}

message OnboardingResponse {
  bool success = 1;
}
