syntax = "proto3";

package user;

service AuthService {
  rpc Register (RegisterRequest) returns (RegisterResponse) {}
  rpc Login (LoginRequest) returns (LoginResponse) {}
  rpc UpdateOnboarding (OnboardingRequest) returns (OnboardingResponse) {}
}

message RegisterRequest {
  string email = 1;
  string password = 2;
  string role = 3;
  string university_id = 4;
}

message RegisterResponse {
  string user_id = 1;
  string email = 2;
}

message LoginRequest {
  string email = 1;
  string password = 2;
}

message LoginResponse {
  string user_id = 1;
  string email = 2;
  string role = 3;
  string access_token = 4;
  bool is_onboarded = 5;
}

message OnboardingRequest {
  string user_id = 1;
  string role = 2;
  // Student fields
  optional string full_name = 3;
  optional string career = 4;
  optional int32 academic_cycle = 5;
  // Employer fields
  optional string company_name = 6;
  optional string sector = 7;
}

message OnboardingResponse {
  bool success = 1;
}

service ProfileService {
  rpc UpdateStudentProfile (UpdateStudentProfileRequest) returns (UpdateProfileResponse) {}
  rpc UpdateEmployerProfile (UpdateEmployerProfileRequest) returns (UpdateProfileResponse) {}
}

message UpdateStudentProfileRequest {
  string user_id = 1;
  optional string full_name = 2;
  optional string career = 3;
  optional int32 academic_cycle = 4;
  optional string bio = 5;
  optional string university_id = 6;
  optional string availability_blocks = 7; // JSON string
}

message UpdateEmployerProfileRequest {
  string user_id = 1;
  optional string company_name = 2;
  optional string ruc = 3;
  optional string sector = 4;
}

message UpdateProfileResponse {
  bool is_onboarded = 1;
}
