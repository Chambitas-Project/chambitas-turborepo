syntax = "proto3";

package analytics;

service AnalyticsService {
  rpc TrackEvent (TrackEventRequest) returns (TrackEventResponse) {}
  rpc GetOverviewKPIs (GetOverviewKPIsRequest) returns (GetOverviewKPIsResponse) {}
}

message TrackEventRequest {
  string userId = 1;
  string eventType = 2;
  string source = 3;
  string payloadJson = 4; // Usamos string para evitar google.protobuf.Any
  string timestamp = 5;
}

message TrackEventResponse {
  bool success = 1;
}

message GetOverviewKPIsRequest {
}

message GetOverviewKPIsResponse {
  int32 activeStudents = 1;
  int32 totalProjects = 2;
  int32 totalApplications = 3;
  double totalIncomeGenerated = 4;
  double avgTimeToHireDays = 5;
  string funnelDataJson = 6;
  string incomeProgressJson = 7;
}
